name: AI catalog research pilot
on:
  schedule:
    - cron: '43 7 * * *'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grantos-production-discovery
  cancel-in-progress: false
jobs:
  research:
    if: vars.BETA_JOBS_ENABLED == 'true' && vars.CATALOG_AI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: beta-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Research public grant source links within the pilot allowance
        run: node --import tsx scripts/ai-catalog-worker.ts
        env:
          DISCOVERY_DATABASE_URL: ${{ secrets.DISCOVERY_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CATALOG_AI_ENABLED: 'true'
