# Separate, disposable staging only. Applying creates credentials/resources:
# obtain explicit approval first. Never apply this to the existing live service.
services:
  - type: web
    name: grantos-staging
    runtime: node
    repo: https://github.com/tobias-fletch/grantos
    branch: feat/staging-catalog-readiness
    region: virginia
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: node scripts/start-staging.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: BETA_MODE
        value: 'true'
      - key: TRUST_PROXY
        value: render
      - key: AUTH_TRUST_HOST
        value: 'true'
      - key: AUTH_SECRET
        generateValue: true
      - key: STAGING_DATABASE_URL
        fromDatabase:
          name: grantos-staging-db
          property: connectionString
      - key: STAGING_CONFIRMATION
        value: grantos-isolated-staging
      - key: SUPPORT_EMAIL
        value: tobias.fletch@gmail.com
      - key: EMAIL_ENABLED
        value: 'false'
      - key: GMAIL_OAUTH_PRODUCTION_CONFIRMED
        value: 'false'
      - key: CATALOG_AI_ENABLED
        value: 'false'
      - key: LIVE_GRANT_SEARCH
        value: 'false'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'

databases:
  - name: grantos-staging-db
    databaseName: grantos_staging
    user: grantos_staging
    postgresMajorVersion: '18'
    region: virginia
    plan: free
    ipAllowList: []
